<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Out — Side Panel</title>
  <link rel="icon" id="favicon" href="icons/icon128.png?v=2">
  <link rel="stylesheet" href="style.css">
  <style>
    .container { padding: 16px 12px 40px; }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <h1 id="greeting"></h1>
      <div class="date" id="dateDisplay"></div>
    </div>
    <div class="header-right">
      <button id="openPageView" class="sp-view-btn">Page View</button>
    </div>
  </header>

  <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
    <div class="tab-cleanup-left">
      <div class="tab-cleanup-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" /></svg>
      </div>
      <div class="tab-cleanup-text">
        <strong id="tabOutDupeCount"></strong> duplicate tabs detected. Close the old ones?
      </div>
    </div>
    <button class="tab-cleanup-btn" data-action="close-tabout-dupes">Close extras</button>
  </div>

  <div class="section-header" id="sectionHeader">
    <h2>Open tabs</h2>
    <div class="section-line"></div>
    <div class="section-count" id="sectionCount"></div>
    <button class="refresh-btn" id="refreshBtn" title="Refresh">↻</button>
  </div>

  <div class="missions" id="missionsGrid"></div>

  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-checkmark">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>
    </div>
    <div class="empty-title">Inbox zero, but for tabs.</div>
    <div class="empty-subtitle">You're free.</div>
  </div>

  <footer>
    <div class="footer-stats">
      <div class="stat">
        <div class="stat-num" id="statTabs">—</div>
        <div class="stat-label">Open tabs</div>
      </div>
    </div>
    <div class="footer-credit">
      <a href="https://github.com/zarazhangrui/tab-out" target="_top">Tab Out</a>
    </div>
  </footer>
</div>

<div class="toast" id="toast">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
  <span id="toastText"></span>
</div>

<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
